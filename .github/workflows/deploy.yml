name: Build & Sync PHANA Personal Platform

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages-build-sync'
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static site and root bundles
        run: npm run build

      - name: Commit updated root bundles if modified on GitHub web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-compile production bundles [skip ci]"
            git push origin main
          fi
