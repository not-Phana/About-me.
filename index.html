<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)" />

    />
    <meta name="author" content="Phana Kurosaki" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PHANA // PK Studio" />
    <meta property="og:title" content="Phana Kurosaki (PHANA / KON) — I build ideas into things you can use." />
    <meta
      property="og:description"
      content="Software, experiments, developer tools, and interactive projects by Phana Kurosaki (github.com/phanaach4889)."
    />
    <meta property="og:image" content="./og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / Telegram Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phana Kurosaki (PHANA / KON) — Independent Builder" />
    <meta
      name="twitter:description"
      content="Software, websites, developer tools, and interactive projects by Phana Kurosaki."
    />
    <meta name="twitter:image" content="./og-image.svg" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Typography: Cinzel (Ancient Greco-Roman Monumental Epigraphy), Bricolage Grotesque (Display), Cormorant Garamond (Classical Greek Serif), Instrument Serif, Instrument Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/app.bundle.css?v=mv3xug66" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pk-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script defer src="./assets/app.bundle.js?v=mv3xug66"></script>
  </head>
  <body class="bg-bg text-ink antialiased selection:bg-accent selection:text-[#0b0b0c]">
    <div id="root"></div>
  </body>
</html>
