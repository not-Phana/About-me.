<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor">
  <defs>
    <linearGradient id="pkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ca68"/>
      <stop offset="50%" stop-color="#e0a234"/>
      <stop offset="100%" stop-color="#b47414"/>
    </linearGradient>
    <radialGradient id="pkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5ca68" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0a234" stop-opacity="0"/>
    </radialGradient>
    <filter id="pkBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central subtle ambient glow -->
  <circle cx="32" cy="30" r="22" fill="url(#pkGlow)" opacity="0.25"/>

  <!-- Left Hemisphere (Organic Cortex Curves) -->
  <g stroke="url(#pkGold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 31 10 C 22 10 14 16 14 24 C 14 27 15 29 17 31 C 13 33 11 37 11 41 C 11 47 16 52 23 52 C 26 52 29 50 31 48" />
    <path d="M 23 20 C 19 22 18 27 21 31" />
    <path d="M 27 27 C 23 29 22 35 26 39" />
    <path d="M 31 36 C 26 38 24 43 27 46" />
    <path d="M 31 18 C 26 19 23 23 25 26" />
  </g>

  <!-- Right Hemisphere (Geometric Neural Circuit) -->
  <g stroke="url(#pkGold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 33 10 C 42 10 50 16 50 24 C 50 27 49 29 47 31 C 51 33 53 37 53 41 C 53 47 48 52 41 52 C 38 52 35 50 33 48" />
    <line x1="33" y1="14" x2="43" y2="18"/>
    <line x1="43" y1="18" x2="48" y2="28"/>
    <line x1="33" y1="24" x2="43" y2="18"/>
    <line x1="33" y1="24" x2="40" y2="31"/>
    <line x1="40" y1="31" x2="48" y2="28"/>
    <line x1="40" y1="31" x2="49" y2="40"/>
    <line x1="33" y1="38" x2="40" y2="31"/>
    <line x1="33" y1="38" x2="42" y2="46"/>
    <line x1="42" y1="46" x2="49" y2="40"/>
  </g>

  <!-- Neural Synapse Nodes (Right Hemisphere) -->
  <g fill="url(#pkGold)">
    <circle cx="43" cy="18" r="2.2" filter="url(#pkBloom)"/>
    <circle cx="48" cy="28" r="2"/>
    <circle cx="40" cy="31" r="2.5" filter="url(#pkBloom)"/>
    <circle cx="49" cy="40" r="2"/>
    <circle cx="42" cy="46" r="2"/>
  </g>

  <!-- Central Axis & Spark -->
  <line x1="32" y1="10" x2="32" y2="52" stroke="url(#pkGold)" stroke-width="1.6" stroke-dasharray="2 3"/>
  <circle cx="32" cy="24" r="2.8" fill="#fff" filter="url(#pkBloom)"/>
  <circle cx="32" cy="38" r="2" fill="#fff" opacity="0.9"/>
</svg>

