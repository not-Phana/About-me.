<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cx-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c14"/>
    </radialGradient>
    <linearGradient id="cx-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#cx-bg)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Hexagonal Code Core -->
  <polygon points="64,26 96,44 96,84 64,102 32,84 32,44" fill="#03261b" stroke="url(#cx-glow)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Code Matrix Grid Lines -->
  <line x1="48" y1="52" x2="80" y2="52" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="42" y1="64" x2="86" y2="64" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="48" y1="76" x2="74" y2="76" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Corner Connector Nodes -->
  <circle cx="64" cy="26" r="3.5" fill="#6ee7b7"/>
  <circle cx="96" cy="44" r="3.5" fill="#34d399"/>
  <circle cx="96" cy="84" r="3.5" fill="#10b981"/>
  <circle cx="64" cy="102" r="3.5" fill="#6ee7b7"/>
  <circle cx="32" cy="84" r="3.5" fill="#10b981"/>
  <circle cx="32" cy="44" r="3.5" fill="#34d399"/>
</svg>
